name: Site

# Builds the Jekyll site in website/ and publishes it to Cloudflare, served at
# https://idct.tech/sticker-maker/ by a Worker that is nothing but static assets, bound to
# that path by the routes in website/wrangler.jsonc. The rest of idct.tech is the org's apex
# site (repo: ideaconnect.github.io), still on GitHub Pages, and every path outside
# /sticker-maker/ carries on through to it untouched. There are no docs to publish alongside
# it, and this app has no public source repository.
#
# One-time setup (already done on this repo): the CLOUDFLARE_AUTHENTICATION_TOKEN secret, an
# API token that can edit Workers scripts and Workers routes on this account and the idct.tech
# zone, and CLOUDFLARE_ACCOUNT_ID. Nothing is set up in the Cloudflare dashboard: the first
# deploy creates the Worker and its routes. Cloudflare's own Git integration is deliberately
# not used — it would deploy on every push whether or not the checks below passed.

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/pages.yml
  # Runs on PRs too, so a broken site is caught before it reaches the domain.
  # Nothing is uploaded or deployed from a PR — see the `if` guards below.
  pull_request:
    paths:
      - website/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel a publish that is already running.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: website
      - name: Build website (Jekyll)
        working-directory: website
        # JEKYLL_ENV=production gates the Google Analytics include (_includes/
        # analytics.html) so gtag is emitted only on the deployed site, never in
        # local development builds.
        # --baseurl must match _config.yml's baseurl (/sticker-maker).
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "/sticker-maker"

      # These are the addresses the outside world already holds: the app opens the privacy
      # page, the Play listing links privacy and the site, and Web3Forms sends everyone who
      # submits the contact form to the thank-you page. Pretty permalinks are what put each
      # one at <name>/index.html; a page renamed or a permalink dropped would 404 one of them
      # with nothing else to notice, so assert the structure instead of finding out later.
      - name: Verify every published URL is still there
        working-directory: website/_site
        run: |
          missing=0
          for f in \
            index.html \
            features/index.html \
            privacy/index.html \
            terms/index.html \
            contact/index.html \
            contact/thank-you/index.html \
            404.html \
            robots.txt \
            sitemap.xml
          do
            if [ ! -f "$f" ]; then echo "::error::missing _site/$f"; missing=1; fi
          done
          exit $missing

      # The route keeps the /sticker-maker/ prefix on every request, and baseurl bakes that
      # prefix into every link Jekyll writes, so the tree Cloudflare serves has _site/ one
      # level down.
      - name: Assemble the tree Cloudflare serves
        if: github.ref == 'refs/heads/main'
        working-directory: website
        run: |
          mkdir _deploy
          cp -r _site _deploy/sticker-maker

      # Wrangler is pinned so a release of it cannot change what a deploy does between two
      # pushes that changed nothing here.
      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_AUTHENTICATION_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.136.3'
          workingDirectory: website
          command: deploy

      # A green deploy only means Cloudflare accepted the upload. This asks the live addresses:
      # each has to come from Cloudflare rather than GitHub, which is what a missing or
      # mis-typed route looks like, and has to be byte-for-byte the page this run built, which
      # is what a deploy that went somewhere else looks like. The zone rewrites email addresses
      # in HTML it proxies from GitHub, but not in what the Worker serves, so a difference is
      # real either way. Retried, because a new route takes a few seconds to reach every edge.
      #
      # The privacy URL is requested exactly as lib/features/about/about_data.dart spells it,
      # without the trailing slash, so the redirect onto privacy/ is checked with it.
      #
      # Each response is captured before it is tested, not piped into grep: without pipefail a
      # curl that got nothing would hand grep an empty string, every "is it wrong" test would
      # come back no, and a site that is down would pass.
      - name: Verify the live site is the one just deployed
        if: github.ref == 'refs/heads/main'
        working-directory: website
        run: |
          check() {
            headers=$(curl -fsSIL "$1" || true)
            curl -fsSL "$1" -o live.html || rm -f live.html
            if [ -z "$headers" ] || [ ! -s live.html ]; then
              echo "$1 did not answer"
            elif grep -qi '^x-github-request-id:' <<<"$headers"; then
              echo "$1 is still served by GitHub"
            elif ! cmp -s live.html "_site/$2"; then
              echo "$1 is not the $2 this run built"
            else
              return 0
            fi
            return 1
          }
          for attempt in 1 2 3 4 5 6; do
            if check https://idct.tech/sticker-maker/ index.html &&
               check https://idct.tech/sticker-maker/privacy privacy/index.html; then
              echo 'https://idct.tech/sticker-maker/ is served by Cloudflare, from this build'
              exit 0
            fi
            echo "attempt $attempt failed"
            sleep 10
          done
          echo "::error::https://idct.tech/sticker-maker/ is not serving this deploy"
          exit 1
